<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CV</title>
    <meta name="description" content="CV y portfolio de Federico Bonaldo" />
    <meta name="theme-color" content="#0b0f14" />
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />

    <!-- Va en <head> y es síncrono a propósito: aplica el tema guardado antes del primer pintado. -->
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <!-- Pantalla de carga: se ve al instante, antes de que Blazor termine de descargar. -->
        <div class="boot-bar" aria-hidden="true"><span></span></div>
        <div class="boot" role="status" aria-live="polite">
            <p class="boot-prompt">$ whoami</p>
            <h1 class="boot-name">Federico Bonaldo<span class="cursor" aria-hidden="true">_</span></h1>
            <p class="boot-headline">Desarrollador de software y estudiante de ciberseguridad</p>
            <p class="boot-status">cargando portfolio… </p>

            <div class="boot-skeleton" aria-hidden="true">
                <div class="sk sk-line" style="width: 92%"></div>
                <div class="sk sk-line" style="width: 80%"></div>
                <div class="sk sk-line" style="width: 64%"></div>
                <div class="boot-row">
                    <div class="sk sk-btn"></div>
                    <div class="sk sk-btn"></div>
                </div>
                <div class="sk sk-card" style="height: 190px"></div>
                <div class="sk sk-card" style="height: 120px"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/section-nav.js"></script>
</body>

</html>
