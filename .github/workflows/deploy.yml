name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test CvPortfolio.sln --configuration Release

      - name: Publish
        run: dotnet publish src/CvPortfolio.Web/CvPortfolio.Web.csproj -c Release -o release

      # Si el sitio vive en https://usuario.github.io/<repo>/ hay que ajustar <base href>.
      # Si el repo se llama <usuario>.github.io, se deja "/".
      - name: Set base href
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" != *.github.io ]]; then
            sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" release/wwwroot/index.html
            sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" release/wwwroot/404.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
